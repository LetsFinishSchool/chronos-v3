<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="980" viewBox="0 0 1740 980" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="44" font-size="24" font-weight="bold">Cargo-Workspace: Crates und erlaubte Abhängigkeiten</text>
<text x="40" y="68" font-size="14" fill="#555">arc42 Kapitel 5, Crate-Zuschnitt (freigegeben 2026-11-24). Pfeil A → B: A darf von B abhängen. Rot gestrichelt: verbotene Kante.</text>
<rect x="40" y="100" width="1640" height="610" rx="10" fill="none" stroke="#555" stroke-dasharray="8 6"/>
<text x="52" y="124" font-size="14" fill="#444">Cargo-Workspace (crates/)</text>
<rect x="655" y="150" width="400" height="110" rx="8" fill="#1168bd" stroke="#0b4884" />
<text x="855.0" y="181.0" font-size="14" text-anchor="middle" fill="#ffffff">chronos</text>
<text x="855.0" y="200.0" font-size="14" text-anchor="middle" fill="#ffffff">[Binary, crates/chronos]</text>
<text x="855.0" y="219.0" font-size="14" text-anchor="middle" fill="#ffffff">Unterbefehle serve, worker, migrate; einziger</text>
<text x="855.0" y="238.0" font-size="14" text-anchor="middle" fill="#ffffff">Ort, an dem alles zusammengesteckt wird</text>
<rect x="80" y="340" width="230" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="195.0" y="376.5" font-size="14" text-anchor="middle" fill="#0b1f33">chronos-web</text>
<text x="195.0" y="395.5" font-size="14" text-anchor="middle" fill="#0b1f33">[crates/web]</text>
<text x="195.0" y="414.5" font-size="14" text-anchor="middle" fill="#0b1f33">HTTP, Oberfläche</text>
<text x="195.0" y="433.5" font-size="14" text-anchor="middle" fill="#0b1f33">ausliefern, Sitzung, Feed,</text>
<text x="195.0" y="452.5" font-size="14" text-anchor="middle" fill="#0b1f33">Assistent</text>
<rect x="410" y="340" width="230" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="525.0" y="386.0" font-size="14" text-anchor="middle" fill="#0b1f33">chronos-domain</text>
<text x="525.0" y="405.0" font-size="14" text-anchor="middle" fill="#0b1f33">[crates/domain]</text>
<text x="525.0" y="424.0" font-size="14" text-anchor="middle" fill="#0b1f33">Fachbereiche: Teams,</text>
<text x="525.0" y="443.0" font-size="14" text-anchor="middle" fill="#0b1f33">Termine, ...</text>
<rect x="740" y="340" width="230" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="855.0" y="386.0" font-size="14" text-anchor="middle" fill="#0b1f33">chronos-channels</text>
<text x="855.0" y="405.0" font-size="14" text-anchor="middle" fill="#0b1f33">[crates/channels]</text>
<text x="855.0" y="424.0" font-size="14" text-anchor="middle" fill="#0b1f33">Zustellkanäle: Web Push,</text>
<text x="855.0" y="443.0" font-size="14" text-anchor="middle" fill="#0b1f33">E-Mail</text>
<rect x="1070" y="340" width="230" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="1185.0" y="386.0" font-size="14" text-anchor="middle" fill="#0b1f33">chronos-worker</text>
<text x="1185.0" y="405.0" font-size="14" text-anchor="middle" fill="#0b1f33">[crates/worker]</text>
<text x="1185.0" y="424.0" font-size="14" text-anchor="middle" fill="#0b1f33">Outbox, Benachrichtigung,</text>
<text x="1185.0" y="443.0" font-size="14" text-anchor="middle" fill="#0b1f33">Zeitauslöser</text>
<rect x="1400" y="340" width="230" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="1515.0" y="376.5" font-size="14" text-anchor="middle" fill="#0b1f33">chronos-adapters</text>
<text x="1515.0" y="395.5" font-size="14" text-anchor="middle" fill="#0b1f33">[crates/adapters]</text>
<text x="1515.0" y="414.5" font-size="14" text-anchor="middle" fill="#0b1f33">Keycloak, KI-Gateway,</text>
<text x="1515.0" y="433.5" font-size="14" text-anchor="middle" fill="#0b1f33">Ferien-Quelle, Backup (ein</text>
<text x="1515.0" y="452.5" font-size="14" text-anchor="middle" fill="#0b1f33">Modul je Adapter)</text>
<rect x="80" y="580" width="1550" height="100" rx="8" fill="#438dd5" stroke="#2e6295" />
<text x="855.0" y="615.5" font-size="14" text-anchor="middle" fill="#ffffff">chronos-core</text>
<text x="855.0" y="634.5" font-size="14" text-anchor="middle" fill="#ffffff">[crates/core]</text>
<text x="855.0" y="653.5" font-size="14" text-anchor="middle" fill="#ffffff">Operationsschicht und Rahmen, Kontext, Fehler, Zeit, Kostenerfassung; hängt von nichts im Workspace ab</text>
<rect x="80" y="740" width="1550" height="120" rx="8" fill="#f4f4f4" stroke="#888888" />
<text x="855.0" y="776.0" font-size="14" text-anchor="middle" fill="#222222">Regeln und Sicherung</text>
<text x="855.0" y="795.0" font-size="14" text-anchor="middle" fill="#222222">Regel 1: Clients (web) greifen nur über die Operationsschicht zu und kennen domain nicht. Regel 2: Fachbereiche (domain) erzeugen nur Ereignisse und kennen weder channels noch adapters.</text>
<text x="855.0" y="814.0" font-size="14" text-anchor="middle" fill="#222222">Gesichert durch: Positivliste der Kanten als Test über cargo metadata (schützt auch vor Änderungen an der Cargo.toml); der Compiler verhindert Importe ohne Eintrag; cargo-deny (bans, wrappers)</text>
<text x="855.0" y="833.0" font-size="14" text-anchor="middle" fill="#222222">beschränkt Bibliotheken je Crate.</text>
