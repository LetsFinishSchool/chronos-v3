[project]
name = "chronos-spike"
version = "0.1.0"
description = "Spike E-002: Chronos-Durchstich in Python"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "python-dateutil>=2.9",
  "tzdata>=2024.2",
  "pyjwt[crypto]>=2.9",
  "authlib>=1.3",
  "httpx>=0.27",
  "aiosmtplib>=3.0",
  "pywebpush>=2.0",
  "anthropic>=0.40",
]

[dependency-groups]
dev = ["import-linter>=2.1", "pytest>=8"]

[tool.uv]
package = false

[tool.importlinter]
root_package = "chronos"

[[tool.importlinter.contracts]]
name = "Fachbereiche kennen die Kanaele nicht (S-9)"
type = "forbidden"
source_modules = ["chronos.domain", "chronos.core"]
forbidden_modules = ["chronos.channels"]
allow_indirect_imports = false

[tool.pytest.ini_options]
pythonpath = ["."]
