<!doctype html>
<meta charset="utf-8">
<title>Spike: Web-Push-Test</title>
<h1>Web-Push-Test (K3)</h1>
<p>Token einfügen (<code>python3 get_token.py alice</code>):</p>
<textarea id="tok" rows="4" cols="80"></textarea><br>
<p>VAPID-Public-Key (kein Geheimnis; wird vom Testskript in die Adresse gelegt, <code>?key=…</code>). Ist das Feld leer, wird <code>GET /api/v1/push/vapid-public-key</code> versucht, das V-1 nicht vorschreibt:</p>
<input id="key" size="90"><br>
<button id="sub">Abo anlegen</button>
<button id="test">Test-Push senden</button>
<pre id="out"></pre>
<script>
const out = (m) => { document.getElementById("out").textContent += m + "\n"; };
const tok = () => document.getElementById("tok").value.trim();
const op = (name, params) => fetch("/api/v1/operations/" + name, { method: "POST",
  headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok() },
  body: JSON.stringify({ params }) }).then(async (r) => ({ status: r.status, body: await r.text() }));
document.getElementById("key").value = new URLSearchParams(location.search).get("key") || "";
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
document.getElementById("sub").onclick = async () => {
  try {
    let key = document.getElementById("key").value.trim();
    if (!key) key = (await (await fetch("/api/v1/push/vapid-public-key")).json()).public_key;
    const reg = await navigator.serviceWorker.register("/static/sw.js", { scope: "/static/" });
    await navigator.serviceWorker.ready;
    if ((await Notification.requestPermission()) !== "granted") { out("Berechtigung verweigert"); return; }
    const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    const j = s.toJSON();
    const r = await op("notification.subscribe_push", { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
    out(r.status === 200 ? "Abo gespeichert" : "Fehler " + r.status + " " + r.body);
  } catch (e) { out("Fehler: " + e); }
};
document.getElementById("test").onclick = async () => {
  const r = await op("notification.test_push", {});
  out("test_push: " + r.status + " " + r.body);
};
</script>
