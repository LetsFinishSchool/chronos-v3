apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-worker
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chronos.selector" (dict "root" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chronos.selector" (dict "root" $ "component" "worker") | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- include "chronos.podSecurity" . | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: {{ include "chronos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [worker]
          env:
            - name: DATABASE_URL_APP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL_APP
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "chronos.containerSecurity" . | nindent 10 }}
