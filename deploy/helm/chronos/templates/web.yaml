apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-web
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chronos.selector" (dict "root" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chronos.selector" (dict "root" $ "component" "web") | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- include "chronos.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "chronos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          env:
            # The default 127.0.0.1 would make the pod unreachable.
            - name: CHRONOS_LISTEN
              value: {{ .Values.web.listen | quote }}
            - name: DATABASE_URL_APP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL_APP
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "chronos.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-web
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chronos.selector" (dict "root" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronos-web
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chronos-web
                port:
                  name: http
