[package]
name = "chronos"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["chrono", "uuid"] }
jsonschema = "0.61"
inventory = "0.3"
rrule = "0.14"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
openidconnect = "4"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
futures = "0.3"
tower-http = { version = "0.7", features = ["fs"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
