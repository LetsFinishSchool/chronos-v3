name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Neue Advisories und die Vorwarnung vor Ablauf erscheinen auch ohne PR.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main may run a deploy; cancelling it mid-`helm upgrade` would leave the
  # release in pending-upgrade and block the next deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # query! liest .sqlx statt einer Datenbank; die Prüfung der Dateien macht Job sqlx-offline.
  SQLX_OFFLINE: "true"

jobs:
  format:
    if: github.event_name != 'schedule'
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'schedule'
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Gleiche Major-Version wie compose.yaml (ADR-003).
        image: postgres:19
        env:
          POSTGRES_DB: chronos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d chronos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://chronos_migrate:chronos_migrate@127.0.0.1:5432/chronos
      DATABASE_URL_APP: postgres://chronos_app:chronos_app@127.0.0.1:5432/chronos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152,cargo-insta@1.49.0
      - run: psql postgres://postgres:postgres@127.0.0.1:5432/chronos -v ON_ERROR_STOP=1 -f tools/db/init-roles.sql
      # Ersetzt `cargo nextest run`: insta nutzt nextest als Testrunner, die Suite läuft einmal.
      # Offene und verwaiste Snapshots der Operationsschemas schlagen fehl. `cargo insta` kennt
      # kein `--locked`; die Lockdatei prüfen die anderen Jobs.
      - run: cargo insta test --check --workspace --test-runner nextest --unreferenced=reject
      # nextest führt keine Doctests aus
      - run: cargo test --workspace --doc --locked

  sqlx-offline:
    if: github.event_name != 'schedule'
    name: sqlx offline
    runs-on: ubuntu-latest
    services:
      postgres:
        # Gleiche Major-Version wie compose.yaml (ADR-003).
        image: postgres:19
        env:
          POSTGRES_DB: chronos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d chronos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://chronos_migrate:chronos_migrate@127.0.0.1:5432/chronos
      DATABASE_URL_APP: postgres://chronos_app:chronos_app@127.0.0.1:5432/chronos
      # Die Prüfung braucht die Datenbank, nicht den Offline-Modus.
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # install-action kennt sqlx-cli nicht; Version von Hand anheben (Dependabot sieht sie nicht).
      - run: cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features rustls,postgres
      - run: psql postgres://postgres:postgres@127.0.0.1:5432/chronos -v ON_ERROR_STOP=1 -f tools/db/init-roles.sql
      # Das Binary baut offline mit den eingecheckten .sqlx-Daten: `query!` braucht
      # sonst schon beim Übersetzen das Schema, das erst `migrate` anlegt.
      - run: cargo run --locked -- migrate
        env:
          SQLX_OFFLINE: "true"
      - run: cargo sqlx prepare --workspace --check -- --all-targets

  frontend:
    if: github.event_name != 'schedule'
    name: Frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        # Gleiche Major-Version wie compose.yaml (ADR-003).
        image: postgres:19
        env:
          POSTGRES_DB: chronos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d chronos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://chronos_migrate:chronos_migrate@127.0.0.1:5432/chronos
      DATABASE_URL_APP: postgres://chronos_app:chronos_app@127.0.0.1:5432/chronos
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Nur Hinweis, kein Merge-Blocker, bis die Behandlung von Ausnahmen entschieden ist (ADR-007 N5).
      - run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
      - run: npm run build
      - run: npm run bundle-size
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - run: npx playwright install --with-deps chromium
      - run: psql postgres://postgres:postgres@127.0.0.1:5432/chronos -v ON_ERROR_STOP=1 -f ../tools/db/init-roles.sql
      # Der Web-Prozess startet erst auf migriertem Schema; `query!` baut offline mit den .sqlx-Daten.
      - run: cargo run --locked -- migrate
        working-directory: .
        env:
          SQLX_OFFLINE: "true"
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  supply-chain:
    name: Lieferkette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1
      - run: cargo deny check
      - run: tools/check-deny-expiry.sh

  chart:
    if: github.event_name != 'schedule'
    name: Helm-Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both modes: the migration Job differs between install and upgrade.
      - run: helm lint deploy/helm/chronos -f deploy/helm/chronos/values-staging.yaml --set image.tag=lint
      - run: helm template chronos deploy/helm/chronos -f deploy/helm/chronos/values-staging.yaml --set image.tag=lint > /dev/null
      - run: helm template chronos deploy/helm/chronos -f deploy/helm/chronos/values-staging.yaml --set image.tag=lint --is-upgrade > /dev/null

  image:
    if: github.event_name != 'schedule'
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/letsfinishschool/chronos-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pull requests only build the image (checks the Dockerfile); push and deploy happen on main.
      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    name: Deploy staging
    needs: [format, clippy, test, sqlx-offline, supply-chain, chart, image]
    runs-on: ubuntu-latest
    environment: staging
    # Never two Helm runs at once; a queued run waits instead of cancelling the rollout.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      # --atomic: a failed migration Job or failed probes roll back to the previous release.
      - run: >-
          helm upgrade --install chronos deploy/helm/chronos
          --namespace chronos-staging
          -f deploy/helm/chronos/values-staging.yaml
          --set-string image.tag=${{ github.sha }}
          --atomic --wait --wait-for-jobs --timeout 5m
