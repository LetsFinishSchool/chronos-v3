<text x="1250.0" y="660.0" font-size="14" text-anchor="middle" fill="#ffffff">PostgreSQL</text>
<text x="1250.0" y="679.0" font-size="14" text-anchor="middle" fill="#ffffff">Fachdaten, Verlauf, Outbox</text>
