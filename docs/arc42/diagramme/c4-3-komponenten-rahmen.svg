<text x="185.0" y="120.5" font-size="14" text-anchor="middle" fill="#ffffff">Aufrufer</text>
<text x="185.0" y="139.5" font-size="14" text-anchor="middle" fill="#ffffff">Oberfläche, Assistent,</text>
<text x="185.0" y="158.5" font-size="14" text-anchor="middle" fill="#ffffff">Worker, Import</text>
<rect x="1220" y="100" width="250" height="70" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="1345.0" y="130.0" font-size="14" text-anchor="middle" fill="#0b1f33">Freigabe-Beleg</text>
<text x="1345.0" y="149.0" font-size="14" text-anchor="middle" fill="#0b1f33">gültig 10 Minuten</text>
<rect x="60" y="300" width="250" height="200" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="185.0" y="385.5" font-size="14" text-anchor="middle" fill="#0b1f33">1 Transaktion öffnen</text>
<text x="185.0" y="404.5" font-size="14" text-anchor="middle" fill="#0b1f33">Lesende Operationen als READ</text>
<text x="185.0" y="423.5" font-size="14" text-anchor="middle" fill="#0b1f33">ONLY</text>
<rect x="350" y="300" width="250" height="200" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="475.0" y="366.5" font-size="14" text-anchor="middle" fill="#0b1f33">2 Geltungsbereich prüfen</text>
<text x="475.0" y="385.5" font-size="14" text-anchor="middle" fill="#0b1f33">Aus den Parametern ableiten,</text>
<text x="475.0" y="404.5" font-size="14" text-anchor="middle" fill="#0b1f33">gegen Akteur-Art prüfen;</text>
<text x="475.0" y="423.5" font-size="14" text-anchor="middle" fill="#0b1f33">erzeugt geprüften Kontext</text>
<text x="475.0" y="442.5" font-size="14" text-anchor="middle" fill="#0b1f33">(ohne Adapter)</text>
<rect x="640" y="300" width="250" height="200" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="765.0" y="385.5" font-size="14" text-anchor="middle" fill="#0b1f33">3 Fachlogik ausführen</text>
<text x="765.0" y="404.5" font-size="14" text-anchor="middle" fill="#0b1f33">Änderungen und Ereignisse</text>
<text x="765.0" y="423.5" font-size="14" text-anchor="middle" fill="#0b1f33">werden gesammelt</text>
<rect x="930" y="300" width="250" height="200" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="1055.0" y="376.0" font-size="14" text-anchor="middle" fill="#0b1f33">4 Verlauf und Outbox</text>
<text x="1055.0" y="395.0" font-size="14" text-anchor="middle" fill="#0b1f33">schreiben</text>
<text x="1055.0" y="414.0" font-size="14" text-anchor="middle" fill="#0b1f33">Akteur und Bündel-ID, in</text>
<text x="1055.0" y="433.0" font-size="14" text-anchor="middle" fill="#0b1f33">derselben Transaktion</text>
<rect x="1220" y="300" width="250" height="200" rx="8" fill="#85bbf0" stroke="#5d82a8" />
<text x="1345.0" y="376.0" font-size="14" text-anchor="middle" fill="#0b1f33">5 Commit oder Rollback</text>
<text x="1345.0" y="395.0" font-size="14" text-anchor="middle" fill="#0b1f33">Vorschau: Probelauf mit</text>
<text x="1345.0" y="414.0" font-size="14" text-anchor="middle" fill="#0b1f33">Rollback; Stapel max. 50</text>
<text x="1345.0" y="433.0" font-size="14" text-anchor="middle" fill="#0b1f33">Aufrufe oder 500 Objekte</text>
