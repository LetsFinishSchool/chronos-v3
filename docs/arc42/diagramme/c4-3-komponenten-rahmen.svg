<text x="765.0" y="660.0" font-size="14" text-anchor="middle" fill="#0b1f33">Trait: Name, Schema,</text>
<text x="765.0" y="679.0" font-size="14" text-anchor="middle" fill="#0b1f33">Bereich; Registrierung über</text>
<text x="765.0" y="698.0" font-size="14" text-anchor="middle" fill="#0b1f33">inventory</text>
