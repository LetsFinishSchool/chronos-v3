<text font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#4b5563"><tspan x="0" y="27.8">S103 Startseite: Wireframe zu Ticket 103 (Task 114)</tspan></text>
<text font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#374151"><tspan x="0" y="60.25">Farben, Abstände und Schriftstile als Token-Namen aus designs/tokens/tokens.json in geschweiften Klammern. Texte als Fluent-Schlüssel mit Beispieltext (ADR-010). Füllfarben zeigen den hellen Modus; der dunkle nutzt dieselben Namen.</tspan></text>
<text font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#374151"><tspan x="0" y="88.25">Layoutstufen: Mobil ab 320 px, Tablet ab {breakpoint.tablet}, Desktop ab {breakpoint.desktop}. Die Textspalte ist höchstens {size.text-max} breit (gestrichelte Linie).</tspan></text>
