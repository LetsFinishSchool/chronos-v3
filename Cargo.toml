# Cargo-Workspace von Chronos.
#
# Crate-Zuschnitt und erlaubte Kanten: docs/arc42/05-bausteine/02-crate-zuschnitt.md
# und ADR-009. Die Kanten prüft crates/chronos/tests/architecture.rs.

[workspace]
resolver = "3"
members = [
    "crates/chronos",
    "crates/adapters",
    "crates/channels",
    "crates/core",
    "crates/domain",
    "crates/web",
    "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
repository = "https://github.com/LetsFinishSchool/chronos-v3"

[workspace.dependencies]
chronos-adapters = { path = "crates/adapters" }
chronos-channels = { path = "crates/channels" }
chronos-core = { path = "crates/core" }
chronos-domain = { path = "crates/domain" }
chronos-web = { path = "crates/web" }
chronos-worker = { path = "crates/worker" }

cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
insta = { version = "1", features = ["json"] }
inventory = "0.3"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "json",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
